<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spider’s Jungle Adventure! · ELA2 T3W7</title><style>
:root{--wine:#80132f;--gold:#e8b86d;--cream:#fff9f2;--leaf:#1e754f;--ink:#273b2d}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Trebuchet MS,Arial,sans-serif;background:linear-gradient(#92d9e7 0 20%,#a6df9c 50%,#417d50 100%);min-height:100vh}.world{position:fixed;inset:0;pointer-events:none;overflow:hidden}.sun{position:absolute;right:9%;top:6%;width:90px;height:90px;border-radius:50%;background:#ffe698;box-shadow:0 0 55px #fff0a8}.canopy{position:absolute;top:-30px;font-size:clamp(70px,15vw,180px);filter:drop-shadow(0 9px 8px #26532b55)}.left{left:-22px}.right{right:-10px}.ground{position:absolute;bottom:-30px;width:100%;height:25%;background:radial-gradient(ellipse at 50% 0,#80c965,#285f39)}.flora{position:absolute;bottom:3%;font-size:clamp(35px,7vw,75px)}.flora.a{left:1%}.flora.b{right:2%}.shell{position:relative;z-index:1;max-width:960px;margin:20px auto;padding:0 14px 24px}.hero{background:linear-gradient(120deg,#80132f,#a03b4b);border:3px solid var(--gold);border-radius:28px 28px 12px 12px;color:#fff;text-align:center;padding:18px 20px;box-shadow:0 10px 30px #163c2c66}.eyebrow{color:#ffe0a0;font-size:12px;letter-spacing:1.4px;font-weight:900}.hero h1{font-size:clamp(27px,5vw,43px);margin:7px 0}.hero p{margin:6px 0;color:#fff1d6}.panel{background:var(--cream);border:4px solid var(--wine);border-top:0;border-radius:0 0 26px 26px;padding:clamp(16px,4vw,30px);box-shadow:0 18px 40px #13392277}.stats{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:900}.pill{border-radius:40px;background:#f6e4d5;padding:9px 15px;color:var(--wine)}.trail{display:flex;justify-content:space-between;gap:3px;margin:18px 0}.paw{flex:1;text-align:center;padding:7px 0;border-radius:14px;background:#e6e5d4;color:#75846b;font-size:clamp(13px,3vw,23px);transition:.2s}.paw.done{background:#e8b86d;color:#653a20}.paw.now{background:#27734c;color:white;transform:translateY(-3px);box-shadow:0 4px 0 #174b33}.scene{border-radius:20px;background:linear-gradient(180deg,#d8f6f0,#eaf4cc);border:2px dashed #a3b87c;text-align:center;padding:14px 10px;margin:12px 0}.scene .art{font-size:clamp(42px,8vw,78px);letter-spacing:8px}.zone{font-weight:900;color:#7c2a40;font-size:15px}.question{font-size:clamp(22px,4vw,30px);text-align:center;line-height:1.3;margin:18px 0}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.choice{min-height:166px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:14px 9px;border:3px solid #e5caa1;border-radius:20px;background:#fff;cursor:pointer;color:#3d3440;font-family:inherit;font-weight:800;font-size:clamp(15px,2vw,18px);transition:transform .12s,background .12s}.choice:hover:not(:disabled){transform:translateY(-4px);background:#fff5df}.choice:focus-visible,button:focus-visible{outline:4px solid #1687c7;outline-offset:3px}.choice .picture{font-size:clamp(38px,6vw,65px)}.choice .letter{font-size:12px;color:#8c5164}.choice.correct{background:#d7f4d8;border-color:#25864c}.choice.wrong{background:#ffe1df;border-color:#c34e53}.choice:disabled{cursor:default}.feedback{min-height:58px;margin:14px 0;padding:12px;border-radius:12px;background:#f5ead9;font-weight:800;line-height:1.4}.feedback:empty{background:transparent}.controls{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}.btn{font:800 15px Trebuchet MS,Arial,sans-serif;border:2px solid #80132f;border-radius:14px;padding:12px 16px;background:white;color:#80132f;cursor:pointer}.btn.primary{background:#80132f;color:white}.btn:disabled{opacity:.45;cursor:not-allowed}.hidden{display:none!important}.finish{text-align:center}.trophy{font-size:90px}.review{margin-top:20px;text-align:left}.review-item{background:white;border:1px solid #e8cdbb;padding:12px;margin:8px 0;border-radius:12px}.review-item strong{color:#80132f}.tiny{text-align:center;font-size:12px;color:#6a6260;margin-top:14px}@media(max-width:620px){.options{grid-template-columns:1fr}.choice{min-height:90px;flex-direction:row;justify-content:flex-start;text-align:left;padding:10px 15px}.choice .picture{font-size:39px}.choice .letter{width:20px}.scene .art{letter-spacing:2px}.hero{padding:16px 8px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><div class="world" aria-hidden="true"><div class="sun"></div><div class="canopy left">🌴🌿</div><div class="canopy right">🌿🌴</div><div class="ground"></div><div class="flora a">🌺🌱🍄</div><div class="flora b">🌼🌿🌺</div></div><main class="shell"><header class="hero"><div class="eyebrow">WPA ELA · GRADE 2 · TERM 3 · WEEK 7 · LESSON 1</div><h1>🕷️ Spider’s Jungle Adventure! 🌴</h1><p>Read • Compare • Discover • Grow</p></header><section class="panel"><div id="play"><div class="stats"><span class="pill" id="counter">Mission 1 of 10</span><span class="pill" id="score">⭐ 0 / 100 points</span></div><div class="trail" id="trail" aria-label="Question progress"></div><div class="scene"><div class="zone" id="zone"></div><div class="art" id="art" aria-hidden="true">🕷️🌴🐸</div></div><h2 class="question" id="question"></h2><div class="controls" style="margin-bottom:14px"><button class="btn" id="speak" type="button">🔊 Read aloud</button><button class="btn" id="mute" type="button">🔔 Sound on</button></div><div class="options" id="options"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><div class="controls"><button class="btn" id="prev" type="button">← Previous</button><button class="btn primary" id="next" type="button" disabled>Next mission →</button><button class="btn" id="restart" type="button">↻ Restart</button></div></div><div class="finish hidden" id="finish"><div class="trophy">🏆🌟</div><h2>Jungle Explorer Award!</h2><h3 id="finalScore"></h3><p id="finalMessage"></p><div class="controls"><button class="btn primary" id="reviewButton">📖 Review answers</button><button class="btn" id="again">↻ Play again</button></div><div id="review" class="review hidden"></div></div><p class="tiny">Your answers stay on this device while the game is open. No internet needed.</p></section></main><script>
const questions=[{"q": "Who tells what happens in a story?", "options": ["Narrator", "Illustrator", "Reader"], "answer": 0, "icons": ["📖", "🎨", "👀"], "zone": "Storytelling Tree"}, {"q": "What does greedy mean?", "options": ["Wants more than is fair", "Shares everything", "Sleeps all day"], "answer": 0, "icons": ["🍌", "🤲", "😴"], "zone": "The Greedy Web"}, {"q": "Which word means very tasty?", "options": ["Stuck", "Delicious", "Careful"], "answer": 1, "icons": ["🪨", "😋", "🧐"], "zone": "Jungle Word Garden"}, {"q": "Who is Spider’s friend in the story?", "options": ["Jade", "Frog", "Bear"], "answer": 0, "icons": ["🧒", "🐸", "🐻"], "zone": "Friendship Vines"}, {"q": "Where does Jade lead Spider?", "options": ["A banana tree", "A school", "A river boat"], "answer": 0, "icons": ["🌴", "🏫", "🚣"], "zone": "Banana Grove"}, {"q": "Who does Spider say needs food?", "options": ["His mother", "His teacher", "His brother"], "answer": 0, "icons": ["👩", "👩‍🏫", "👦"], "zone": "Spider’s Secret"}, {"q": "Which action shows greed?", "options": ["Eating more after being full", "Sharing food", "Helping a friend"], "answer": 0, "icons": ["🍽️", "🤝", "💛"], "zone": "The Greed Challenge"}, {"q": "What does compare mean?", "options": ["Find what is alike", "Find the title", "Count the pages"], "answer": 0, "icons": ["🪞", "📘", "🔢"], "zone": "Compare Clearing"}, {"q": "What does contrast mean?", "options": ["Find what is different", "Find what is alike", "Read faster"], "answer": 0, "icons": ["🔎", "🪞", "📖"], "zone": "Contrast Crossing"}, {"q": "How are Spider and Frog alike?", "options": ["Both are animal characters", "Both are birds", "Both are teachers"], "answer": 0, "icons": ["🐍🐸", "🐦", "👩‍🏫"], "zone": "Animal Friends Finale"}];
const $=id=>document.getElementById(id);let index=0;let responses=Array(questions.length).fill(null);let soundOn=true;let audioContext;const scenes=['🕷️📖🌳','🕷️🍌🌿','🌺🍯🍌','🕷️🧒🌴','🌴🍌🕷️','🕷️🍃🏡','🕷️🍌🍌','🐸🕷️🔍','🦋🌳🕷️','🐸🕷️🌺'];
function score(){return responses.reduce((s,r,i)=>s+(r===questions[i].answer?10:0),0)}
function sound(ok){if(!soundOn)return;try{audioContext=audioContext||new (window.AudioContext||window.webkitAudioContext)();let t=audioContext.currentTime;[0,1,2].forEach((n)=>{const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type='sine';osc.frequency.value=(ok?[523,659,784]:[280,230,190])[n];gain.gain.setValueAtTime(.001,t+n*.09);gain.gain.exponentialRampToValueAtTime(.09,t+n*.09+.01);gain.gain.exponentialRampToValueAtTime(.001,t+n*.09+.14);osc.connect(gain).connect(audioContext.destination);osc.start(t+n*.09);osc.stop(t+n*.09+.15)})}catch(e){}}
function draw(){const q=questions[index],r=responses[index];$('counter').textContent='Jungle Mission '+(index+1)+' of '+questions.length;$('score').textContent='⭐ '+score()+' / 100 points';$('zone').textContent=q.zone;$('art').textContent=scenes[index];$('question').textContent=q.q;$('trail').replaceChildren();questions.forEach((_,i)=>{let p=document.createElement('span');p.className='paw '+(i===index?'now':responses[i]!==null?'done':'');p.textContent=responses[i]!==null?'⭐':'🐾';p.setAttribute('aria-label','Mission '+(i+1)+(responses[i]!==null?' answered':''));$('trail').append(p)});$('options').replaceChildren();q.options.forEach((opt,j)=>{let b=document.createElement('button');b.className='choice'+(r!==null?(j===q.answer?' correct':j===r?' wrong':''):'');b.disabled=r!==null;b.innerHTML='<span class="letter">'+String.fromCharCode(65+j)+'</span><span class="picture" aria-hidden="true">'+q.icons[j]+'</span><span></span>';b.lastElementChild.textContent=opt;b.addEventListener('click',()=>pick(j));$('options').append(b)});$('feedback').textContent=r===null?'':r===q.answer?'🌟 Great job! You earned 10 Jungle Stars!':'Keep exploring! The correct answer is '+q.options[q.answer]+'.';$('prev').disabled=index===0;$('next').disabled=r===null;$('next').textContent=index===questions.length-1?'See my award →':'Next mission →'}
function pick(j){if(responses[index]!==null)return;responses[index]=j;sound(j===questions[index].answer);draw()}
function finish(){if('speechSynthesis'in window)speechSynthesis.cancel();$('play').classList.add('hidden');$('finish').classList.remove('hidden');$('finalScore').textContent='You earned '+score()+' out of 100 points!';$('finalMessage').textContent=score()===100?'Perfect! You are a Jungle Story Champion!':score()>=70?'Wonderful exploring! Keep using story clues.':'Great effort! Review the story and try again.';$('review').classList.add('hidden');$('review').replaceChildren()}
function reset(){if('speechSynthesis'in window)speechSynthesis.cancel();index=0;responses=Array(questions.length).fill(null);$('play').classList.remove('hidden');$('finish').classList.add('hidden');draw()}
$('prev').onclick=()=>{if(index>0){index--;draw()}};$('next').onclick=()=>{if(responses[index]===null)return;if(index===questions.length-1)finish();else{index++;draw()}};$('restart').onclick=reset;$('again').onclick=reset;$('mute').onclick=()=>{soundOn=!soundOn;$('mute').textContent=soundOn?'🔔 Sound on':'🔕 Sound off'};$('speak').onclick=()=>{if(!('speechSynthesis'in window)){$('feedback').textContent='Read-aloud is not available in this browser.';return}speechSynthesis.cancel();const q=questions[index],utter=new SpeechSynthesisUtterance(q.q+'. '+q.options.map((o,i)=>'Option '+String.fromCharCode(65+i)+': '+o).join('. '));utter.lang='en-US';utter.rate=.82;speechSynthesis.speak(utter)};$('reviewButton').onclick=()=>{const target=$('review');target.classList.toggle('hidden');if(target.classList.contains('hidden'))return;target.replaceChildren();questions.forEach((q,i)=>{let item=document.createElement('div');item.className='review-item';let heading=document.createElement('strong');heading.textContent=(i+1)+'. '+q.q;let detail=document.createElement('div');detail.textContent='Your answer: '+q.options[responses[i]]+' | Correct answer: '+q.options[q.answer];item.append(heading,detail);target.append(item)})};draw();
</script></body></html>
